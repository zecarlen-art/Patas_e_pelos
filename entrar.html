
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entre | Patas & Pelos</title>

    <link rel="stylesheet" href="entrar.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>
        <a href="index.html" class="logo">
            <div class="popplio">
                <img src="img/Logo_Patas___Pelos-removebg-preview.png"
                     alt="Logo Patas e Pelos">
            </div>

            Patas & Pelos
        </a>

        <nav>
            <ul>
                <li><a href="banho.html">Banho e Tosa</a></li>
                <li><a href="hotelzinho.html">Hotelzinho</a></li>
                <li><a href="petshop.html">Petshop</a></li>
            </ul>
        </nav>

        <div class="header-actions">
            <a href="entrar.html" class="btn-login">Entre</a>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">

        <!-- IMAGEM LATERAL -->
        <section class="lateral">


        </section>

        <!-- ÁREA DOS FORMULÁRIOS -->
        <section class="conteudo">

            <div class="formulario">

                <!-- LOGO -->
                <div class="marca">
                    <img src="img/Logo_Patas___Pelos-removebg-preview.png"
                         alt="Logo Patas e Pelos">

                    <h2>Patas & Pelos</h2>
                </div>

                <!-- ABAS -->
                <div class="abas">

                    <button type="button" id="abaLogin"
                        onclick="mostrarLogin()">
                        Login
                    </button>

                    <button type="button" id="abaCadastro"
                            onclick="mostrarCadastro()">
                        Cadastro
                    </button>

                </div>

                <!-- FORMULÁRIO DE LOGIN -->
                <form id="formLogin" onsubmit="entrar(event)">

                    <h1>Bem-vindo de volta!</h1>

                    <p>Entre na sua conta para continuar.</p>

                    <label for="emailLogin">E-mail</label>
                    <input type="email"
                           id="emailLogin"
                           placeholder="Seu e-mail"
                           required>

                    <label for="senhaLogin">Senha</label>
                    <input type="password"
                           id="senhaLogin"
                           placeholder="Sua senha"
                           required>

                    <button type="submit" class="botao">
                        Entrar
                    </button>

                    <div class="alternativa">
                        Ainda não tem conta?

                        <a href="#" onclick="mostrarCadastro(); return false;">
                            Cadastre-se
                        </a>
                    </div>

                </form>

                <!-- FORMULÁRIO DE CADASTRO -->
                <form id="formCadastro"
                      class="escondido"
                      action="cadastro.php"
                      method="POST"
                      onsubmit="return validarCadastro()">

                    <h1>Crie sua conta!</h1>

                    <p>Cadastre-se para aproveitar nossos serviços.</p>

                    <label for="nome">Nome completo</label>
                    <input type="text"
                           id="nome"
                           name="nome"
                           placeholder="Seu nome"
                           required>

                    <label for="email">E-mail</label>
                    <input type="email"
                           id="email"
                           name="email"
                           placeholder="Seu e-mail"
                           required>

                    <label for="telefone">Telefone</label>
                    <input type="tel"
                           id="telefone"
                           name="telefone"
                           placeholder="(00) 00000-0000"
                           required>

                    <label for="pet">Nome do seu pet</label>
                    <input type="text"
                           id="pet"
                           name="pet"
                           placeholder="Nome do seu animal"
                           required>

                    <label for="senha">Senha</label>
                    <input type="password"
                           id="senha"
                           name="senha"
                           placeholder="Crie uma senha"
                           required>

                    <label for="confirmar">Confirmar senha</label>
                    <input type="password"
                           id="confirmar"
                           placeholder="Digite a senha novamente"
                           required>

                    <button type="submit" class="botao">
                        Criar conta
                    </button>

                    <div class="alternativa">
                        Já possui uma conta?

                        <a href="#" onclick="mostrarLogin(); return false;">
                            Faça login
                        </a>
                    </div>

                </form>

            </div>

        </section>

    </main>

    <!-- JAVASCRIPT -->
    <script src="entrar.js"></script>

</body>
</html>
