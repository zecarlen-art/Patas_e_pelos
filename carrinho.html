<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="carrinho.css"
</head>
<body>
    <!-- BOTÃO FLUTUANTE DO CARRINHO -->
    <button id="cart-btn" class="cart-btn" onclick="toggleCart()">
        🛒 Carrinho (<span id="cart-count">0</span>)
    </button>

    <!-- SIDEBAR DO CARRINHO -->
    <aside id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h2>Seu Carrinho</h2>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>

        <div id="cart-items" class="cart-items">
            <!-- Os itens adicionados aparecerão aqui via JavaScript -->
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">R$ 0,00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Finalizar Compra</button>
        </div>
    </aside>

    <!-- SOBREPOSIÇÃO PARA FECHAR O CARRINHO -->
    <div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>

    <!-- SCRIPT DO CARRINHO -->
    <script src="carrinho.js"></script>
</body>
</body>
</html>
